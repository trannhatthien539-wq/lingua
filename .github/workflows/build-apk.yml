name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cần quyền ghi để commit keystore cố định ở lần chạy đầu tiên.
permissions:
  contents: write

env:
  # Keystore cố định cho bản debug: nhờ nó SHA-1 của APK không đổi giữa các lần build,
  # nên Google Cloud chỉ cần đăng ký SHA-1 một lần là đăng nhập Google chạy mãi.
  KEYSTORE_PATH: .github/keystore/lingua-debug.keystore
  KEYSTORE_PASSWORD: lingua-debug-2026
  KEY_ALIAS: lingua-debug
  KEY_PASSWORD: lingua-debug-2026

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor
        run: npm install --no-save @capacitor/core@6.2.2 @capacitor/cli@6.2.2 @capacitor/android@6.2.2 @codetrix-studio/capacitor-google-auth@3.4.0-rc.4

      # Java cần có trước khi tạo keystore (keytool).
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------------------
      # Google Sign-In: APK phải được ký bằng một chứng chỉ cố định, nếu không
      # SHA-1 đổi mỗi lần build và Google luôn từ chối đăng nhập.
      # ---------------------------------------------------------------------
      - name: Warn when the Google client id is missing
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::warning title=Thiếu Web client ID::APK vẫn cài được, nhưng muốn đăng nhập Google thì cần dán Web client ID vào Cài đặt → Tài khoản trong app (hoặc thêm secret VITE_GOOGLE_WEB_CLIENT_ID rồi build lại)."
          fi

      - name: Create or reuse the fixed debug keystore
        id: keystore
        run: |
          set -euo pipefail
          if [ ! -f "$KEYSTORE_PATH" ]; then
            mkdir -p "$(dirname "$KEYSTORE_PATH")"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=Lingua Debug, OU=Mobile, O=Lingua, L=Hanoi, ST=Hanoi, C=VN"
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi
          SHA1=$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep -iE 'SHA-?1:' | head -1 | sed 's/.*SHA-*1: *//')
          printf '%s\n' "$SHA1" > .github/keystore/SHA1.txt
          echo "SHA1=$SHA1" >> "$GITHUB_ENV"
          echo "SHA-1 dùng cho OAuth Android client: $SHA1"

      - name: Save the keystore in the repo (first run only)
        if: steps.keystore.outputs.created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$KEYSTORE_PATH" .github/keystore/SHA1.txt
          git commit -m "Add the fixed Android debug keystore so the Google sign-in SHA-1 stops changing [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Inject the Google client id into the Capacitor config
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then exit 0; fi
          node -e "const fs=require('fs');const file='capacitor.config.json';const config=JSON.parse(fs.readFileSync(file,'utf8'));config.plugins=Object.assign({},config.plugins,{GoogleAuth:{scopes:['profile','email'],serverClientId:process.env.GOOGLE_WEB_CLIENT_ID,forceCodeForRefreshToken:true}});fs.writeFileSync(file,JSON.stringify(config,null,2)+'\n');"

      - name: Build web assets
        env:
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
        run: npm run build

      - name: Initialize Capacitor when needed
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init Lingua com.lingua.studyhub --web-dir dist
          fi

      - name: Add Android platform and sync
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      # ---------------------------------------------------------------------
      # Đăng nhập Google bằng Chrome: Chrome trả kết quả về app qua deep link
      # com.lingua.studyhub://auth#id_token=… nên AndroidManifest phải khai báo
      # scheme này và MainActivity phải là singleTask để app nhận lại intent.
      # Cách này không cần SHA-1 / Android OAuth client.
      # ---------------------------------------------------------------------
      - name: Allow the app to receive the Google sign-in deep link
        env:
          APP_URL_SCHEME: com.lingua.studyhub
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'android/app/src/main/AndroidManifest.xml';
          const scheme = process.env.APP_URL_SCHEME;
          let xml = fs.readFileSync(file, 'utf8');

          if (!/android:launchMode="singleTask"/.test(xml)) {
            xml = xml.replace(/(<activity[^>]*?android:name="\.MainActivity")/, '$1 android:launchMode="singleTask"');
          }
          if (!xml.includes(`android:scheme="${scheme}"`)) {
            const filter = [
              '',
              '            <intent-filter>',
              '                <action android:name="android.intent.action.VIEW" />',
              '                <category android:name="android.intent.category.DEFAULT" />',
              '                <category android:name="android.intent.category.BROWSABLE" />',
              `                <data android:scheme="${scheme}" />`,
              '            </intent-filter>',
              '',
            ].join('\n');
            xml = xml.replace(/(<activity[^>]*?android:name="\.MainActivity"[^>]*?>)/, `$1${filter}`);
          }
          fs.writeFileSync(file, xml);

          const ok = xml.includes(`android:scheme="${scheme}"`) && /android:launchMode="singleTask"/.test(xml);
          console.log(xml.match(/<activity[\s\S]*?<\/activity>/)?.[0] || xml);
          if (!ok) {
            console.error('Không thêm được deep link scheme vào AndroidManifest.xml');
            process.exit(1);
          }
          NODE

      - name: Write server_client_id into Android resources
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then exit 0; fi
          FILE=android/app/src/main/res/values/strings.xml
          if [ -f "$FILE" ] && ! grep -q server_client_id "$FILE"; then
            sed -i "s|</resources>|    <string name=\"server_client_id\">${GOOGLE_WEB_CLIENT_ID}</string>\n</resources>|" "$FILE"
          fi

      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ]; then SDK="/usr/local/lib/android/sdk"; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > android/local.properties
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          ls "$SDK/platforms" || true

      - name: Fix Kotlin Duplicate Classes & Build APK
        working-directory: android
        env:
          LINGUA_KEYSTORE: ${{ github.workspace }}/.github/keystore/lingua-debug.keystore
          LINGUA_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          LINGUA_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          LINGUA_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          cat >> build.gradle <<'GRADLE'
          subprojects {
            configurations.all {
              resolutionStrategy {
                force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
              }
            }
          }
          GRADLE
          # Ký bản debug bằng keystore cố định (SHA-1 không đổi giữa các lần build).
          cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  linguaDebug {
                      storeFile file(System.getenv("LINGUA_KEYSTORE"))
                      storePassword System.getenv("LINGUA_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("LINGUA_KEY_ALIAS")
                      keyPassword System.getenv("LINGUA_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.linguaDebug
                  }
              }
          }
          GRADLE
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify the APK signature
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ] && [ -f "$APK" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | grep -i 'SHA-1' || true
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lingua-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Summary with the Google setup steps
        if: always()
        run: |
          {
            echo "## Đăng nhập Google trên APK"
            echo ""
            echo "APK này đăng nhập Google bằng cách mở **Chrome** rồi tự quay về app (deep link \`com.lingua.studyhub://auth\`), nên **không cần SHA-1**, không cần Android OAuth client, không cần keystore cố định."
            echo ""
            echo "Chỉ cần cấu hình 1 lần:"
            echo ""
            echo "1. Firebase Console → Authentication → Sign-in method → Google → bật provider và copy **Web client ID**."
            echo "2. Google Cloud Console → APIs & Services → Credentials → mở OAuth client đó → **Authorized redirect URIs** → thêm:"
            echo ""
            echo '```'
            echo 'https://trannhatthien539-wq.github.io/lingua/oauth-callback.html'
            echo '```'
            echo ""
            echo "3. Mở app → Cài đặt → Tài khoản → dán Web client ID vào mục *Cấu hình đăng nhập Google* (áp dụng ngay, không cần build lại APK)."
            echo ""
            echo "SHA-1 của bản build này (chỉ còn dùng khi bật Google Sign-In native): \`${SHA1:-chưa lấy được}\`"
          } >> "$GITHUB_STEP_SUMMARY"