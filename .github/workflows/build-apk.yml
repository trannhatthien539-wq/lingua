name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor
        run: npm install --no-save @capacitor/core@6.2.2 @capacitor/cli@6.2.2 @capacitor/android@6.2.2 @codetrix-studio/capacitor-google-auth@3.4.0-rc.4

      - name: Build web assets
        env:
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
        run: |
          test -n "$VITE_GOOGLE_WEB_CLIENT_ID"
          npm run build

      - name: Initialize Capacitor when needed
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init Lingua com.lingua.studyhub --web-dir dist
          fi

      - name: Add Android platform and sync
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix Kotlin Duplicate Classes & Build APK
        working-directory: android
        run: |
          cat >> build.gradle <<'GRADLE'
          subprojects {
            configurations.all {
              resolutionStrategy {
                force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
              }
            }
          }
          GRADLE
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lingua-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error