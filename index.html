<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
    <title>Lingua — Language Learning Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return;
        var host = location.hostname;
        var isDeviceApp = Boolean(window.Capacitor);
        var isLocalDev = !isDeviceApp && (
          host === 'localhost' || host === '127.0.0.1' || host === '0.0.0.0' || host === '[::1]' || host.slice(-6) === '.local'
        );
        if (isLocalDev) {
          // Khi chạy dev, service worker từng cache module JS cũ nên trang có thể gặp lỗi
          // "Invalid hook call / nhiều bản React". Gỡ đăng ký và xoá cache ngay khi tải trang.
          navigator.serviceWorker.getRegistrations()
            .then(function (registrations) { registrations.forEach(function (item) { item.unregister(); }); })
            .catch(function () {});
          if (window.caches) caches.keys().then(function (keys) { keys.forEach(function (key) { caches.delete(key); }); }).catch(function () {});
          return;
        }
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(function (registration) {
            registration.update().catch(function () {});
          }).catch(function () {});
        });
      })();
    </script>
  </body>
</html>
