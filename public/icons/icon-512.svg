<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none" role="img" aria-label="Lingua - The Celestial Quill Feather">
  <defs>
    <!-- Background Canvas Gradients (Dành cho PWA & App Icon) -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E24" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#06212B" />
    </linearGradient>
    <linearGradient id="canvasBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="featherAura" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#818CF8" stop-opacity="0.18" />
      <stop offset="85%" stop-color="#080E24" stop-opacity="0" />
    </radialGradient>

    <!-- Feather Main Body Gradients (Màu nước & Gouache đa tầng) -->
    <linearGradient id="featherBase" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="22%" stop-color="#38BDF8" />
      <stop offset="48%" stop-color="#6366F1" />
      <stop offset="72%" stop-color="#4F46E5" />
      <stop offset="90%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Left Vane Accent (Lớp phớt màu ngọc bích & xanh lơ mềm mại) -->
    <linearGradient id="vaneLeftAccent" x1="0.8" y1="0.1" x2="0.1" y2="0.9">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#2DD4BF" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#312E81" stop-opacity="0.9" />
    </linearGradient>

    <!-- Right Vane Accent (Lớp phớt tím iris & lam dạ quang) -->
    <linearGradient id="vaneRightAccent" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#818CF8" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#6366F1" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#312E81" stop-opacity="0.6" />
    </linearGradient>

    <!-- Gold Feather Edge & Rachis (Sống lông & viền cánh dát vàng) -->
    <linearGradient id="rachisGold" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="90%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Gold Calligraphy Nib (Ngòi bút thư pháp mạ vàng) -->
    <linearGradient id="nibGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Luminous Gold Ink Drop (Giọt mực phát quang) -->
    <radialGradient id="inkGlow" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>

    <!-- Filter ánh sáng dịu (Soft Painterly Bloom) -->
    <filter id="featherBloom" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softInkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  
    <!-- Khung Squircle nghệ thuật nền vũ trụ tri thức -->
    <rect width="512" height="512" rx="112.64" fill="url(#canvasBg)" />
    <rect x="1" y="1" width="510" height="510" rx="111.64" fill="none" stroke="url(#canvasBorder)" stroke-width="1.6" stroke-opacity="0.8" />
    <circle cx="266.24" cy="245.76" r="225.28" fill="url(#featherAura)" />
  

  <!-- MAIN ARTWORK GROUP (Scaled) -->
  <g transform="scale(4)">
    <!-- 1. Vầng sáng dịu sau thân lông vũ -->
    <path d="M30 106 C 42 88 56 68 68 50 C 78 36 88 24 97 18 C 104 22 108 34 106 46 C 100 66 84 84 62 96 C 46 104 36 106 30 106 Z" fill="url(#featherBase)" opacity="0.38" filter="url(#featherBloom)" />

    <!-- 2. Thân lông vũ chính (Main Feather Vanes Silhouette - Lớp sơn lót) -->
    <path d="M97 18 
             C 103 24 107 33 107 43 
             C 107 47 104 49 101 50 
             C 105 52 106 58 104 65 
             C 101 73 95 80 88 86 
             C 80 92 70 97 58 100 
             C 48 102 38 104 32 104 
             C 32 101 35 98 39 95 
             C 31 94 25 89 24 81 
             C 24 75 27 71 31 68 
             C 25 66 22 59 23 52 
             C 25 43 31 36 40 30 
             C 52 23 68 18 84 17 
             C 90 16 94 17 97 18 Z" 
          fill="url(#featherBase)" stroke="#312E81" stroke-width="0.8" stroke-linejoin="round" />

    <!-- 3. Cánh lông bên trái (Left Vane - Màu ngọc bích & lơ ngọc uyển chuyển) -->
    <path d="M97 18 
             C 90 17 80 18 69 21 
             C 54 25 42 33 34 42 
             C 28 49 26 56 28 63 
             C 31 60 36 58 41 57 
             C 35 63 32 70 33 77 
             C 35 83 40 87 47 88 
             C 52 83 58 76 64 68 
             C 74 54 84 38 97 18 Z" 
          fill="url(#vaneLeftAccent)" opacity="0.92" />

    <!-- 4. Cánh lông bên phải (Right Vane - Màu tím hoàng gia & lam dạ quang) -->
    <path d="M97 18 
             C 102 24 105 32 104 40 
             C 101 43 96 44 91 46 
             C 97 48 102 54 100 62 
             C 97 70 91 78 84 83 
             C 77 88 68 93 58 97 
             C 66 87 75 74 83 59 
             C 89 47 94 34 97 18 Z" 
          fill="url(#vaneRightAccent)" opacity="0.88" />

    <!-- 5. Tầng cọ lông tơ mềm mại ở đáy cuống (Fluffy Down Feathers) -->
    <g stroke="url(#featherBase)" stroke-width="1.3" stroke-linecap="round" opacity="0.85">
      <path d="M33 103 C 27 101 23 96 24 90 C 26 94 30 98 36 100" />
      <path d="M35 101 C 28 97 25 91 27 85 C 30 89 34 93 39 96" />
      <path d="M38 97 C 32 92 30 85 33 80 C 35 84 39 88 44 91" />
      <path d="M42 94 C 47 96 52 98 56 99" />
      <path d="M45 91 C 51 93 57 95 62 96" />
    </g>

    <!-- 6. Các đường nét cọ vẽ tay chi tiết (Fine Hand-drawn Barb Lines) -->
    <!-- Nhóm phiến lông trái -->
    <g stroke="#BAE6FD" stroke-width="0.75" stroke-linecap="round" opacity="0.65">
      <path d="M88 28 C 76 25 64 28 54 34" />
      <path d="M80 38 C 68 35 56 39 46 47" />
      <path d="M72 48 C 60 47 49 53 40 63" />
      <path d="M64 59 C 54 60 45 68 38 78" />
      <path d="M57 69 C 48 72 42 79 37 87" />
      <path d="M51 79 C 44 83 40 89 36 95" />
    </g>

    <!-- Điểm nhấn cọ màu ngọc & vàng chanh mặt trái -->
    <g stroke="#6EE7B7" stroke-width="0.85" stroke-linecap="round" opacity="0.75">
      <path d="M92 23 C 82 21 72 23 62 28" />
      <path d="M84 33 C 73 31 61 35 50 42" />
      <path d="M76 43 C 65 42 54 48 44 57" />
      <path d="M68 53 C 58 54 48 62 41 72" />
    </g>

    <!-- Nhóm phiến lông phải -->
    <g stroke="#DDD6FE" stroke-width="0.75" stroke-linecap="round" opacity="0.6">
      <path d="M95 24 C 99 29 101 35 100 41" />
      <path d="M90 35 C 95 40 97 46 95 53" />
      <path d="M84 47 C 89 53 92 60 90 68" />
      <path d="M77 60 C 82 67 84 74 81 81" />
      <path d="M70 71 C 74 77 75 83 72 89" />
    </g>

    <!-- Điểm nhấn cọ dạ quang viền phải -->
    <g stroke="#38BDF8" stroke-width="0.8" stroke-linecap="round" opacity="0.7">
      <path d="M93 28 C 97 34 99 40 98 46" />
      <path d="M87 41 C 92 47 94 53 92 60" />
      <path d="M80 54 C 85 61 86 67 83 74" />
      <path d="M73 66 C 77 72 78 78 75 84" />
    </g>

    <!-- 7. Viền sáng dát vàng nghệ thuật dọc mép lông vũ (Gold Edge Gilding) -->
    <path d="M97 18 
             C 99 22 103 28 104 35 
             M 101 49 C 104 53 104 59 101 65 
             M 97 73 C 94 78 88 84 82 88" 
          stroke="url(#rachisGold)" stroke-width="1.1" stroke-linecap="round" opacity="0.85" />

    <path d="M97 18 
             C 88 17 76 18 64 22 
             C 52 26 40 34 32 44 
             M 28 62 C 30 67 34 74 38 80" 
          stroke="url(#rachisGold)" stroke-width="1.1" stroke-linecap="round" opacity="0.85" />

    <!-- 8. Sống lông vũ dát vàng kiêu hãnh (Golden Quill Rachis) -->
    <!-- Lớp bóng sống lông -->
    <path d="M30 106 C 41 90 54 72 66 54 C 77 39 87 27 97 18" 
          stroke="#78350F" stroke-width="3.2" stroke-linecap="round" />
    <!-- Thân sống vàng kim chuyển sắc -->
    <path d="M30 106 C 41 90 54 72 66 54 C 77 39 87 27 97 18" 
          stroke="url(#rachisGold)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Vệt sáng phản chiếu sắc nét trên sống lông -->
    <path d="M32 103 C 43 88 55 71 67 53 C 78 38 87 27 96 19" 
          stroke="#FEF9C3" stroke-width="0.85" stroke-linecap="round" opacity="0.9" />

    <!-- 9. Ngòi bút lông thư pháp nghệ thuật (Calligraphy Quill Nib) -->
    <g id="quillNib">
      <!-- Thân bọc ngòi kim loại mạ vàng -->
      <polygon points="34,101 38,104 29,114 26,111" fill="url(#nibGold)" stroke="#92400E" stroke-width="0.6" stroke-linejoin="round" />
      <!-- Mũi ngòi kim sắc nhọn -->
      <polygon points="28,112 29,114 21,121 21,119 25,112" fill="url(#nibGold)" stroke="#78350F" stroke-width="0.5" stroke-linejoin="round" />
      <!-- Khe dẫn mực của ngòi bút -->
      <line x1="27" y1="113" x2="22" y2="120" stroke="#451A03" stroke-width="0.6" stroke-linecap="round" />
      <!-- Điểm sáng bóng kim loại trên ngòi -->
      <line x1="31" y1="106" x2="27" y2="111" stroke="#FFFFFF" stroke-width="0.7" stroke-linecap="round" />
    </g>

    <!-- 10. Giọt mực tri thức phát sáng lung linh (Luminous Wisdom Ink Drop) -->
    <g id="wisdomInkDrop" filter="url(#softInkGlow)">
      <!-- Vầng hào quang giọt mực -->
      <circle cx="17.5" cy="123.5" r="4" fill="#FDE047" opacity="0.3" />
      <!-- Thân giọt mực hình giọt nước nghiêng -->
      <path d="M21 121 C 21 121 21 124 19 125.5 C 17.5 127 15 126.5 14.5 124.5 C 14 122.5 15.5 120.5 17.5 120 C 19 119.5 21 121 21 121 Z" 
            fill="url(#inkGlow)" stroke="#B45309" stroke-width="0.5" />
      <!-- Điểm phản quang tinh khôi -->
      <circle cx="16.5" cy="122.5" r="1.1" fill="#FFFFFF" />
      <circle cx="18" cy="124.5" r="0.5" fill="#FEF08A" />
    </g>

    <!-- 11. Bụi sao tinh tú & Tia sáng diệu kỳ (Stardust & Wisdom Sparks) -->
    <g id="stardustWisdom" filter="url(#softInkGlow)">
      <!-- Ngôi sao 4 cánh lớn đỉnh lông vũ -->
      <g transform="translate(108, 17)">
        <path d="M0 -5 Q0 0 5 0 Q0 0 0 5 Q0 0 -5 0 Q0 0 0 -5 Z" fill="#FEF08A" />
        <circle cx="0" cy="0" r="1.2" fill="#FFFFFF" />
      </g>
      <!-- Ngôi sao nhỏ vòm trên -->
      <g transform="translate(86, 9)">
        <path d="M0 -3.5 Q0 0 3.5 0 Q0 0 0 3.5 Q0 0 -3.5 0 Q0 0 0 -3.5 Z" fill="#67E8F9" />
        <circle cx="0" cy="0" r="0.9" fill="#FFFFFF" />
      </g>
      <!-- Ngôi sao bên hông trái -->
      <g transform="translate(18, 44)">
        <path d="M0 -3 Q0 0 3 0 Q0 0 0 3 Q0 0 -3 0 Q0 0 0 -3 Z" fill="#FEF08A" />
        <circle cx="0" cy="0" r="0.8" fill="#FFFFFF" />
      </g>
      <!-- Đốm sáng đom đóm tri thức lơ lửng quanh đường cong lông vũ -->
      <circle cx="114" cy="38" r="1.4" fill="#FDE047" opacity="0.9" />
      <circle cx="106" cy="74" r="1.1" fill="#38BDF8" opacity="0.85" />
      <circle cx="20" cy="72" r="1.2" fill="#34D399" opacity="0.85" />
      <circle cx="12" cy="106" r="1.3" fill="#FDE047" opacity="0.9" />
      <circle cx="29" cy="125" r="0.9" fill="#FEF08A" opacity="0.85" />
    </g>
  </g>
</svg>
