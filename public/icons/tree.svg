<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img">
  <defs>
    <linearGradient id="treeLeaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8e878" />
      <stop offset="1" stop-color="#7ea94b" />
    </linearGradient>
    <linearGradient id="treeBark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f6c46" />
      <stop offset="1" stop-color="#6b4f32" />
    </linearGradient>
  </defs>

  <!-- rễ và thân -->
  <g stroke="#1e2a24" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="35" cy="86" rx="7.5" ry="3.4" fill="url(#treeBark)" stroke-width="2.8" />
    <ellipse cx="61" cy="86" rx="7.5" ry="3.4" fill="url(#treeBark)" stroke-width="2.8" />
    <path d="M41 86V57c0-5-2-8-6-11l6 2 7-2 7 2 6-2c-4 3-6 6-6 11v29Z" fill="url(#treeBark)" stroke-width="3" />
  </g>

  <!-- tán cây: vẽ viền trước rồi phủ màu để chỉ còn viền ngoài -->
  <g fill="none" stroke="#1e2a24" stroke-width="3.2">
    <circle cx="30" cy="43" r="17" />
    <circle cx="66" cy="43" r="17" />
    <circle cx="48" cy="28" r="19" />
    <circle cx="48" cy="52" r="16" />
  </g>
  <g fill="url(#treeLeaf)">
    <circle cx="30" cy="43" r="15.6" />
    <circle cx="66" cy="43" r="15.6" />
    <circle cx="48" cy="28" r="17.6" />
    <circle cx="48" cy="52" r="14.6" />
  </g>

  <!-- mảng sáng trên ngọn + mắt cây -->
  <circle cx="46" cy="25" r="13" fill="#e2f5a3" opacity=".5" />
  <circle cx="48" cy="73" r="2.2" fill="#1e2a24" opacity=".55" />
</svg>
